<!DOCTYPE html>
<html>
<head>
    <title>BookMyShow - Close Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        .popup {
            width: 300px;
            padding: 25px;
            margin: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-btn {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

    <div class="popup" id="bookingPopup">
        <h2>BookMyShow</h2>
        <p>Your movie booking is ready!</p>

        <button class="close-btn" onclick="closePopup()">
            Close
        </button>
    </div>

    <script>
        function closePopup() {
            document.getElementById("bookingPopup").style.display = "none";
        }
    </script>

</body>
</html>
